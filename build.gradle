plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'net.okocraft.okochat'
version = '0.1.0'
base.archivesName = 'OkoChatBridge-NeoForge'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repositories { mavenCentral() }
sourceSets.main.java {
    srcDir 'upstream/OkoChat/bridge-protocol/src/main/java'
    srcDir 'upstream/OkoChat/integration/src/main/java'
    srcDir 'upstream/OkoChat/integration-luckperms/src/main/java'
}
neoForge {
    version = '26.2.0.88'
    runs {
        server {
            server()
            programArgument '--nogui'
            jvmArgument '-Xmx1G'
        }
    }
    mods { okochat_bridge { sourceSet sourceSets.main } }
    unitTest {
        enable()
        testedMod = mods.okochat_bridge
    }
}
dependencies {
    ['adventure-api', 'adventure-text-serializer-gson', 'adventure-text-serializer-json',
     'adventure-text-serializer-commons', 'adventure-key'].each { module ->
        jarJar(implementation("net.kyori:" + module)) {
            version { strictly '[5.2.0,6.0.0)'; prefer '5.2.0' }
        }
    }
    jarJar(implementation('net.kyori:option')) {
        version { strictly '[1.1.0,2.0.0)'; prefer '1.1.0' }
    }
    compileOnly 'net.luckperms:api:5.5'
    compileOnly 'org.jetbrains:annotations:26.1.0'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test {
    useJUnitPlatform()
    testLogging { exceptionFormat = 'full' }
}
processResources { inputs.property 'version', project.version; filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) } }
jar { from('LICENSE'); from('NOTICE.md') }
